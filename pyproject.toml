[project]
name = "fast-print"
version = "0.1.0"
description = "A lightweight CLI and automation tool designed to prepare images and documents for printing without the overhead of heavy office suites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.1",
    "pillow>=12.2.0",
    "pypdf>=6.13.0",
    "python-docx>=1.2.0",
    "pywin32>=312",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.17",
]

build = [
    "pyinstaller>=6.20.0",
]


[tool.ruff]
line-length = 98
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "I", # isort
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false